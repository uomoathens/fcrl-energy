name: Energy support run

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Month used to refresh downloaded data
        id: month
        run: echo "value=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: .cache/fcrl
          key: fcrl-data-${{ steps.month.outputs.value }}
      - name: Synthetic demonstration
        run: fcrl-energy run --config configs/synthetic.yaml --output outputs/synthetic --summary "$GITHUB_STEP_SUMMARY"
      - name: Real data, Southern Europe (Eurostat)
        if: always()
        run: fcrl-energy run --config configs/europe_south.yaml --output outputs/europe_south --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: energy-support-reports
          path: outputs/
          retention-days: 90
      - name: Assemble the dashboard site
        run: |
          mkdir -p site
          cp outputs/europe_south/dashboard.html site/index.html
          cp outputs/synthetic/dashboard.html site/synthetic.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: run
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
